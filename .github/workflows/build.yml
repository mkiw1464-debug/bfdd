name: Build 3105 IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT: ThreeOneOSFive.xcodeproj
  SCHEME: 3105
  CONFIGURATION: Release
  SDK: iphoneos

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Select Xcode 16.2 ─────────────────────────────────────────
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # ── 3. Show targets (debug) ───────────────────────────────────────
      - name: List targets
        run: |
          xcodebuild -project "$PROJECT" -list

      # ── 4. Build (unsigned) ───────────────────────────────────────────
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk "$SDK" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build \
            | xcpretty --color && exit "${PIPESTATUS[0]}"

      # ── 5. Locate .app ────────────────────────────────────────────────
      - name: Locate .app
        id: locate
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData" \
            -name "*.app" \
            -path "*/Release-iphoneos/*" \
            ! -name "*.appex" \
            | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found in DerivedData"
            find "$RUNNER_TEMP/DerivedData" -name "*.app" | head -10
            exit 1
          fi
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"
          ls -la "$APP"

      # ── 6. Package as IPA ─────────────────────────────────────────────
      - name: Package IPA
        run: |
          PAYLOAD_DIR="$RUNNER_TEMP/ipa_staging/Payload"
          mkdir -p "$PAYLOAD_DIR"
          APP_NAME=$(basename "${{ steps.locate.outputs.app_path }}")
          cp -r "${{ steps.locate.outputs.app_path }}" "$PAYLOAD_DIR/$APP_NAME"
          cd "$RUNNER_TEMP/ipa_staging"
          zip -r "$RUNNER_TEMP/3105-unsigned.ipa" Payload/
          echo "IPA size: $(du -sh $RUNNER_TEMP/3105-unsigned.ipa | cut -f1)"

      # ── 7. Upload artifact ────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/3105-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
