name: Build 3105 IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT: ThreeOneOSFive.xcodeproj
  SCHEME: 3105
  CONFIGURATION: Release
  SDK: iphoneos

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: List targets
        run: xcodebuild -project "$PROJECT" -list

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk "$SDK" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME="" \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES \
            CLANG_ENABLE_MODULES=NO \
            OTHER_CFLAGS="-fno-modules -Wno-deprecated-declarations" \
            build \
            | xcpretty --color && exit "${PIPESTATUS[0]}"

      - name: Locate .app
        id: locate
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData" \
            -name "*.app" \
            -path "*/Release-iphoneos/*" \
            ! -name "*.appex" \
            | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            find "$RUNNER_TEMP/DerivedData" -name "*.app" | head -10
            exit 1
          fi
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
          echo "Found: $APP"

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "${{ steps.locate.outputs.app_path }}" \
            "$RUNNER_TEMP/ipa/Payload/$(basename ${{ steps.locate.outputs.app_path }})"
          cd "$RUNNER_TEMP/ipa"
          zip -r "$RUNNER_TEMP/3105-unsigned.ipa" Payload/
          echo "IPA: $(du -sh $RUNNER_TEMP/3105-unsigned.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/3105-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
